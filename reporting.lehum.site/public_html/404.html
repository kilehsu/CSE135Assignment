<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a; color: #e2e8f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .container { text-align: center; padding: 40px 24px; max-width: 480px; }
    .code {
      font-size: 96px; font-weight: 800; color: #6366f1;
      line-height: 1; letter-spacing: -4px; margin-bottom: 16px;
    }
    h1 { font-size: 22px; font-weight: 600; color: #f1f5f9; margin-bottom: 10px; }
    p  { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block; padding: 10px 22px;
      background: #6366f1; color: #fff; text-decoration: none;
      border-radius: 8px; font-size: 14px; font-weight: 500;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }
    .btn-ghost {
      background: transparent; border: 1px solid #334155; color: #94a3b8;
      margin-left: 10px;
    }
    .btn-ghost:hover { border-color: #6366f1; color: #6366f1; background: transparent; }
  </style>
  <noscript>
    <style>body { font-family: sans-serif; padding: 40px; }</style>
  </noscript>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/dashboard" class="btn">Go to Dashboard</a>
    <a href="/login" class="btn btn-ghost">Sign In</a>
  </div>
</body>
</html>
