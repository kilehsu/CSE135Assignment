<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Lehum Lab</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="site-header">
    <h1>Lehum Lab</h1>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="feedback.html">Feedback</a>
      <a href="contact.html">Contact</a>
      <a href="quiz.html">Quick Quiz</a>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Contact</h1>
    <p>Send us a message. All fields are optional for testing; in production you’d validate them.</p>

    <div class="card">
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject">
            <option value="question">Question</option>
            <option value="bug">Bug report</option>
            <option value="suggestion">Suggestion</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Your message..." required></textarea>
        </div>
        <button type="submit">Send message</button>
      </form>
      <p id="contactMessage" style="margin-top:1rem;color:var(--muted);"></p>
    </div>
  </main>

  <footer>
    test.lehum.site — CSE 135 HW3 Test Target
  </footer>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('contactMessage').textContent =
        'Message received! (This is a test site; nothing is sent to a server.)';
    });
  </script>
</body>
</html>
